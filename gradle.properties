# Gradle & JVM memory tuning (for 12GB RAM, dual-core/4 threads)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2048m

# Use available threads
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.configureondemand=true

# Persistent build speed-ups
org.gradle.caching=true
# Mozilla rust-android-gradle is incompatible with configuration cache
# (it calls Task.project at execution time).
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# Kotlin & Compose performance
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon

# Android configuration
android.useAndroidX=true
android.nonTransitiveRClass=true

# Disable heavy Compose analysis (reduces CPU load)
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# KSP incremental build speed
ksp.incremental=false
ksp.incremental.log=false
ksp.useKSP2=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
